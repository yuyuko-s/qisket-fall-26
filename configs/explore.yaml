# Exploration chain (notebooks/explore_0*): settings every notebook reads, so a change here
# flows through all later steps. Values follow from the EDA (explore_01); reasons are logged
# in docs/DECISIONS.md. Nothing here is chosen on a test set.

eda:
  # Random subsample of the training pool for slow estimators (mutual information, per-atom
  # charge fits); everything else uses all of P.
  subsample: 20000

cleaning:
  # Geometric duplicates (the same molecule listed twice): formula + Coulomb spectrum rounded
  # to this many decimals. Analyses over the training pool keep one molecule per group.
  duplicate_cm_decimals: 2
  # Of two features with |Spearman rho| >= this (the same information up to a monotone
  # transform), keep the one earlier in priority order. Unsupervised: never looks at mu.
  redundancy_spearman: 0.99

standardization:
  # Feature scalings compared by CV in explore_03 (see src/qm9dipole/preprocess.py).
  candidates: [standard, robust, log_standard, yeo_johnson, quantile_normal]
  # log_standard: signed log1p on columns whose training-set |skewness| exceeds this.
  skew_threshold: 1.0
  # Scale-sensitive models used to choose a scaling (trees are invariant to monotone maps).
  compare_models: [ridge, rbf_krr]
  # Target transforms compared by CV in explore_03; predictions are always in debye.
  target_candidates: [standard, sqrt, log1p]

quantum:
  # Report the share of scaled feature values beyond +-this many standard deviations:
  # rotation angles gamma * x wrap around, so far outliers alias onto ordinary values.
  # (X1 fixed n_qubits: 8 here; X2 chooses the number of inputs by CV in explore_03.)
  angle_sigma: 3

track_a:
  # Exact kernel ridge costs O(N^3) time and O(N^2) memory: run it up to this training size.
  krr_max_n: 10000
  # XGBoost randomized-search draws (models/fitters.XGBFitter), by training size.
  xgb_iter: {small: 20, large: 10}   # small: N <= 10000
  xgb_large_n: 10000

charge_model:
  # Architecture search for the latent-charge network (models/charge.py), on the inner
  # validation split of S_(0, selection_n); the winner runs at every N. Settings shared by
  # every candidate first, then each candidate's own.
  selection_n: 10000
  common: {loss: mae, lr: 0.002, weight_decay: 1.0e-4, batch_size: 64, max_epochs: 300,
           patience: 30, lr_patience: 10, max_steps: 120000}
  candidates:
    linear:              {hidden: [], message_passing: 0, atomic_dipoles: false}
    linear+dipoles:      {hidden: [], message_passing: 0, atomic_dipoles: true}
    mlp:                 {hidden: [128, 64], message_passing: 0, atomic_dipoles: true}
    mp2:                 {hidden: [128, 64], message_passing: 2, atomic_dipoles: true}
    mp3:                 {hidden: [128, 64], message_passing: 3, atomic_dipoles: true}
    mp2-no-dipoles:      {hidden: [128, 64], message_passing: 2, atomic_dipoles: false}
    mp3-narrow:          {hidden: [64, 64], message_passing: 3, atomic_dipoles: true}
    mp2-mse:             {hidden: [128, 64], message_passing: 2, atomic_dipoles: true, loss: mse}

track_b:
  # Matched baselines for a k-qubit model: RBF kernel ridge on k reduced inputs, at these k.
  matched_k: [4, 6, 8, 12, 16]
  models: [mean, ridge, rbf_krr, rf, xgb]
