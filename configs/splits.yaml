# Split configuration (exploration X2 design; see src/qm9dipole/splits.py).
# Changing anything here changes config_hash and requires rebuilding splits/
# (notebooks/01_parse_and_splits.ipynb).

# Exclusions (counts and reasons: README, section 2). The 3,054 uncharacterized molecules are always excluded.
exclude_readme_flagged: true   # also drop the 11 hard-to-converge molecules from readme.txt
# Geometric duplicates (same formula and Coulomb spectrum to this many decimals; same |mu|):
# keep the smallest ID of each group, so no molecule can appear in two sets.
exclude_geometric_duplicates: true
duplicate_cm_decimals: 2

# Split seed: fixes every holdout, the development sets and the quantum subsets.
split_seed: 2026

# Whole-formula holdouts, stratified by heavy-atom count. All molecules of a held-out formula
# go to the holdout.
unseen_formula_frac: 0.15       # test (read once, by scripts/final_eval.py)
dev_unseen_formula_frac: 0.05   # development: of the formulas left after the test holdout

# Random molecules from the remaining formulas; no formula is emptied, so each stays familiar.
familiar_test_frac: 0.05        # test
dev_size: 5000                  # development set for learning curves and diagnostics

# Small fixed subsets of the test sets for the quantum model (inference costs n_test x N circuits).
quantum_unseen_per_formula: 5
quantum_unseen_max_total: 600
n_familiar_formulas: 20         # anchored in every training set; must be < the smallest N
familiar_per_formula: 4

# Nested training sets S_{s,N}: one fill order of the training pool per training seed.
train_sizes: [100, 300, 1000, 3000, 10000, 30000]
train_full_pool: true           # also N = |training pool| (the same set for every seed)
train_seeds: [0, 1, 2]
track_b_sizes: [100, 300, 1000] # the quantum-comparable learning curve (Track B)
