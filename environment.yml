# Conda environment for the QM9 dipole project. From the repo root:
#   conda env create -f environment.yml
#   conda activate qm9dipole
#   pip install -r requirements.txt
#
# Packages are installed by pip only AFTER activation, on purpose: activation sets
# PYTHONNOUSERSITE=1 (below), which hides the per-user site directory
# (%APPDATA%\Python\Python312 on Windows). Inside `conda env create` that variable is not
# yet set, so pip would treat packages found there as "already satisfied" and skip them,
# leaving the environment broken once it is activated.
name: qm9dipole
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
variables:
  PYTHONNOUSERSITE: "1"
